<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <title>Last ned Kongshaug Elevapp</title>
  <meta name="description" content="Last ned Kongshaug Elevapp til iPhone eller Android." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/app/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <style>
    body {
      background: var(--navy);
      background-image: linear-gradient(180deg, #22406a 0%, #1e3a5f 45%, #16293f 100%);
      min-height: 100dvh;
    }
    .wrap {
      max-width: 420px; margin: 0 auto; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: calc(40px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
    }
    .icon {
      width: 108px; height: 108px; border-radius: 26px; display: block;
      box-shadow: 0 14px 34px rgba(0,0,0,.32); background: var(--navy-dark);
    }
    h1 {
      color: #fff; font-size: 27px; font-weight: 800; letter-spacing: -.02em;
      margin: 22px 0 6px; line-height: 1.2;
    }
    .sub { color: #b9c6d8; font-size: 15px; line-height: 1.5; margin: 0; max-width: 300px; }
    .stores { width: 100%; display: flex; flex-direction: column; gap: 12px; margin: 30px 0 0; }
    .store {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; min-height: 62px; padding: 12px 20px;
      background: #fff; border-radius: 16px; text-decoration: none; color: var(--ink);
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
      -webkit-tap-highlight-color: transparent;
    }
    .store:active { background: #eef1f5; }
    .store svg { width: 26px; height: 26px; flex: 0 0 auto; }
    .store-text { text-align: left; line-height: 1.15; }
    .store-text small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
    .store-text b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .notice {
      margin: 28px 0 0; padding: 16px 18px; border-radius: 16px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
      color: #dbe4ef; font-size: 14px; line-height: 1.55;
    }
    .web {
      margin-top: 26px; display: inline-block; color: #cfd9e6; font-size: 14.5px;
      font-weight: 700; text-decoration: none; border-bottom: 1.5px solid rgba(207,217,230,.35);
      padding-bottom: 2px;
    }
    .foot { padding-top: 40px; color: #8ea0b8; font-size: 12.5px; line-height: 1.6; }
    .foot a { color: #b9c6d8; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="/shared/app-icon.png" width="108" height="108"
         alt="App-ikonet til Kongshaug Elevapp" />
    <h1>Kongshaug Elevapp</h1>
    <p class="sub">Brannliste, andakt, middag og ukestjeneste for elever ved Kongshaug Musikkgymnas.</p>

    {{STORES}}

    <a class="web" href="/app/">Eller bruk appen i nettleseren</a>

    <div class="foot">
      Kongshaug Musikkgymnas · <a href="/personvern/">Personvern</a>
    </div>
  </div>
</body>
</html>
